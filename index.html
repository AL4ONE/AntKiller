<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Killer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="app">
        <div class="home-screen ">
            <h1>Ant Killer</h1>
            <form action="">
                <div class="form-input">
                    <label for="username">username</label>
                    <input type="text" class="inputUsername">
                </div>
                <div class="form-input">
                    <select name="level" id="" class="selectLevel"  required>
                        <option value="easy">pilih Level</option>
                        <option value="easy">easy</option>
                        <option value="medium">medium</option>
                        <option value="hard">hard</option>
                    </select>
                </div>

                <button class="btnPlay" disabled type="button">Play</button>
            </form>
        </div>
        <div class="game-screen hide">
            <h3>Score : <span class="scoreEle"></span></h3>
            <div class="container">

            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
